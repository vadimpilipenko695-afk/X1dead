name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r25c }
      
      - name: Download ImGui and KittyMemory
        run: |
          # Скачиваем ImGui
          git clone --depth=1 --branch v1.90.1 https://github.com/ocornut/imgui.git ImGui
          
          # Скачиваем KittyMemory (от MrIkso)
          git clone --depth=1 https://github.com/MrIkso/KittyMemory.git KittyMemory_temp
          mv KittyMemory_temp/KittyMemory ./KittyMemory
          mv KittyMemory_temp/Includes/* ./Includes/ 2>/dev/null || true
          rm -rf KittyMemory_temp
          
      - name: NDK build
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk
            
      - uses: actions/upload-artifact@v4
        with: 
          name: libx1dead
          path: libs/arm64-v8a/libx1dead.so
