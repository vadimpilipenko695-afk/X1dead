name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r25c }
      - name: Dobby
        run: |
          git clone --depth=1 https://github.com/jmpews/Dobby.git
          cd Dobby && mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-Wno-error" -DCMAKE_CXX_FLAGS="-Wno-error" .. 
          make -j
          mkdir -p $GITHUB_WORKSPACE/libs/arm64-v8a
          cp libdobby.a $GITHUB_WORKSPACE/libs/arm64-v8a/
      - name: ImGui
        run: git clone --depth=1 --branch v1.90.1 https://github.com/ocornut/imgui.git
      - name: NDK build
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk
      - uses: actions/upload-artifact@v4
        with: { name: libx1dead, path: libs/arm64-v8a/libx1dead.so }
